name: Windows installer and updates
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing project version (for example 1.0.0)'
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Select and validate version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Only stable numeric versions are accepted.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Headless logic tests (desktop WPF tests run locally)
        shell: pwsh
        run: |
          foreach ($test in @('ItemMenuLogicSmoke', 'ViewLogicSmoke', 'ReadinessSmoke', 'UpdateLogicSmoke')) {
            dotnet run --project "tests/$test" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $test" }
          }
          dotnet run --project tests/PanelAccessSmoke -c Release -- --logic-only
          if ($LASTEXITCODE -ne 0) { throw 'Panel access geometry tests failed.' }
          dotnet run --project tests/MaintenanceSmoke -c Release -- --logic-only
          if ($LASTEXITCODE -ne 0) { throw 'Backup and diagnostic log tests failed.' }
      - name: Build installer and feed
        shell: pwsh
        run: ./scripts/Publish-Installer.ps1 -Version $env:RELEASE_VERSION
      - name: Upgrade previous installation, restart, preserve settings, fresh install and uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Resolve-Path "dist/releases/$env:RELEASE_VERSION/ExternalDrivePanel-win-Setup.exe").Path
          $previousTag = gh release view --repo criticalmasslab/external-drive-panel --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or $previousTag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Previous stable release missing.' }
          $previousDirectory = Join-Path $env:RUNNER_TEMP 'panel-previous'
          New-Item -ItemType Directory -Path $previousDirectory -Force | Out-Null
          gh release download $previousTag --repo criticalmasslab/external-drive-panel --pattern ExternalDrivePanel-win-Setup.exe --dir $previousDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer download failed.' }
          $process = Start-Process -FilePath (Join-Path $previousDirectory 'ExternalDrivePanel-win-Setup.exe') -ArgumentList '--silent' -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'Silent installation failed or timed out.' }
          $installed = Join-Path $env:LOCALAPPDATA 'ExternalDrivePanel'
          $installedExe = Join-Path $installed 'current/ExternalDrivePanel.exe'
          $previousVersion = $previousTag -replace '^v', ''
          if ((Get-Item -LiteralPath $installedExe).VersionInfo.FileVersion -ne "$previousVersion.0") { throw 'Baseline installed version mismatch.' }
          dotnet run --project tests/UpdateLogicSmoke -c Release -- --apply-installed $installed $previousVersion "dist/releases/$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Real update harness failed.' }
          $deadline = [DateTime]::UtcNow.AddSeconds(120)
          do {
            Start-Sleep -Seconds 1
            $version = if (Test-Path -LiteralPath $installedExe) { (Get-Item -LiteralPath $installedExe).VersionInfo.FileVersion } else { '' }
            $appProcesses = @(Get-Process ExternalDrivePanel -ErrorAction SilentlyContinue | Where-Object { $_.Path -ieq $installedExe })
          } while (($version -ne "$env:RELEASE_VERSION.0" -or $appProcesses.Count -eq 0) -and [DateTime]::UtcNow -lt $deadline)
          if ($version -ne "$env:RELEASE_VERSION.0" -or $appProcesses.Count -eq 0) { throw 'Updater failed to replace and restart installation.' }
          Start-Sleep -Seconds 3
          $configPath = Join-Path $env:APPDATA 'ExternalDeskPanel/config.json'
          $expectedHash = (Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'panel-upgrade-config.json')).Hash
          if ((Get-FileHash -LiteralPath $configPath).Hash -ne $expectedHash) { throw 'Upgrade changed settings or favorites.' }
          # Only this disposable runner's fixture app; no user files or live installation.
          $appProcesses | Stop-Process
          $process = Start-Process -FilePath (Join-Path $installed 'Update.exe') -ArgumentList '--uninstall', '--silent' -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'Upgraded installation uninstall failed.' }
          if ((Get-FileHash -LiteralPath $configPath).Hash -ne $expectedHash) { throw 'Uninstall removed user settings.' }
          $process = Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'Fresh installation failed.' }
          Get-ChildItem -LiteralPath $installed | Select-Object Name
          foreach ($file in @('Update.exe', 'current/ExternalDrivePanel.exe', 'current/sq.version')) {
            if (!(Test-Path -LiteralPath (Join-Path $installed $file))) { throw "Installed file missing: $file" }
          }
          $registration = @(Get-ChildItem 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -eq 'External Drive Panel' })
          if ($registration.Count -eq 0) { throw 'Installed Apps registration missing.' }
          $process = Start-Process -FilePath (Join-Path $installed 'Update.exe') -ArgumentList '--uninstall', '--silent' -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(120000) -or $process.ExitCode -ne 0) { throw 'Silent uninstallation failed or timed out.' }
          if (Test-Path -LiteralPath (Join-Path $installed 'current/ExternalDrivePanel.exe')) { throw 'Installed files remain after uninstall.' }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Publish a new version; do not overwrite update packages.' }
          $assets = Get-ChildItem "dist/releases/$env:RELEASE_VERSION" -File | Where-Object { $_.Extension -in @('.exe', '.nupkg', '.json', '.txt') -or $_.Name -like 'RELEASES*' }
          gh release create $tag --target $env:GITHUB_SHA --title "External Drive Panel $env:RELEASE_VERSION" --notes-file RELEASE-NOTES.md --latest @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
